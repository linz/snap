name: Run regression tests on push to master
on:
  push:
    branches:
      - "*"
  pull_request:
    types: [ opened, reopened, synchronize ]

jobs:
  package:
    runs-on: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ "ubuntu-24.04", "ubuntu-26.04" ]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install cmake g++ libboost-dev libboost-math-dev libboost-regex-dev libnetcdf-dev python3 python3-netcdf4
      - name: Build snap command line utilities and run regression tests
        run: python3 build.py release test --no-gui
      - name: Install Poetry
        run: pipx install poetry
      - name: Install Python tool dependencies
        working-directory: src/python
        run: poetry install --with dev
      - name: Lint, type-check, and test src/python
        working-directory: src/python
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run pylint $(git ls-files '*.py')
          poetry run mypy --strict --ignore-missing-imports $(git ls-files '*.py')
          poetry run pytest -v
          poetry run pip-audit
      - name: Lint and type-check the Python files outside src/python
        working-directory: src/python
        run: |
          files=$(git -C ../.. ls-files '*.py' ':!src/python' | sed 's#^#../../#')
          poetry run ruff check $files
          poetry run ruff format --check $files
          poetry run pylint $files
          poetry run mypy --strict --ignore-missing-imports $files

  mingw-zip:
    runs-on: ubuntu-24.04
    env:
      NETCDF_MINGW_ROOT: ${{ github.workspace }}/netcdf-mingw/install
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install cmake g++-mingw-w64-x86-64 libboost-dev python3
      # BOOST_ROOT cannot be /usr, because the Boost headers would then be found through -I/usr/include, which
      # puts the Linux system headers ahead of MinGW's. A folder that holds only boost avoids that.
      - name: Make a folder that holds only the Boost headers
        run: |
          mkdir "$RUNNER_TEMP/boost_root"
          ln -s /usr/include/boost "$RUNNER_TEMP/boost_root/boost"
          echo "BOOST_ROOT=$RUNNER_TEMP/boost_root" >> "$GITHUB_ENV"
      - name: Build the static netCDF stack for MinGW
        run: ./build_mingw_netcdf_stack.py
      # The test programs go in the ZIP too, so that the Windows job that runs the tests has all the programs
      # from one unzip. This ZIP is only for that job; the ZIP that is released is built without them.
      - name: Build the Windows command line utilities
        run: |
          cmake --preset windows-mingw-release -DSNAP_PACKAGE_TEST_PROGRAMS=ON
          cmake --build --preset windows-mingw-release --parallel
      - name: Package the Windows ZIP
        working-directory: build/windows-mingw-release
        run: cpack -G ZIP
      # Jobs run on separate machines, so an artifact is the only way to hand the ZIP to another job. The Windows
      # job that tests it will download it from this run. It is kept for one day because nothing else uses it.
      - name: Upload the Windows ZIP
        uses: actions/upload-artifact@v7.0.2
        with:
          name: snap-windows-mingw-zip
          path: build/windows-mingw-release/*.zip
          if-no-files-found: error
          retention-days: 1

  windows-tests:
    needs: mingw-zip
    runs-on: windows-latest
    # The first runs show which tests fail on Windows itself, so a failure here does not fail the workflow yet
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
      - name: Download the Windows ZIP
        uses: actions/download-artifact@v8.0.2
        with:
          name: snap-windows-mingw-zip
          path: ${{ runner.temp }}/zip
      # The download action has already extracted the artifact, which holds our ZIP, and this extracts that ZIP
      - name: Unzip the programs
        shell: pwsh
        run: Expand-Archive -Path "$env:RUNNER_TEMP/zip/*.zip" -DestinationPath "$env:RUNNER_TEMP/programs"
      # The GGRXF test files are written at test time by a Python script that uses the netCDF4 module
      - name: Install the netCDF4 Python module
        shell: bash
        run: python -m pip install netCDF4
      # The ZIP holds the programs, the unit tests and binroundtrip, so the tests run without a build. The runner has
      # several Pythons, and cmake would find the newest, so it is given the one that netCDF4 was installed into.
      - name: Run the tests against the programs
        shell: bash
        run: |
          programs=$(cygpath -m "$RUNNER_TEMP"/programs/snap-*)
          python_exe=$(cygpath -m "$(command -v python)")
          cmake -S tests_only -B build-tests -DSNAP_PROGRAMS_DIR="$programs" -DPython3_EXECUTABLE="$python_exe"
          ctest --test-dir build-tests -C Release --parallel --output-on-failure
